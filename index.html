<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>健身训练记录</title>
  <style>
    * {box-sizing: border-box;margin:0;padding:0;font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;}
    body {background:#f4f5f7;font-size:16px;color:#222;padding-bottom:20px;}
    /* 顶部黑色标题栏 */
    .header-bar{
      background:#222;
      color:#fff;
      text-align:center;
      padding:18px 0;
      font-size:22px;
      font-weight:bold;
    }
    /* 顶部标签 */
    .tab-top-wrap{
      display:flex;
      background:#fff;
    }
    .tab-top{
      flex:1;
      text-align:center;
      padding:14px 0;
      font-size:19px;
      color:#777;
      border-bottom:3px solid transparent;
      cursor:pointer;
    }
    .tab-top.active{
      color:#007aff;
      border-bottom-color:#007aff;
    }
    .container{
      padding:16px;
    }
    .card{
      background:#fff;
      border-radius:14px;
      padding:18px;
      margin-bottom:18px;
    }
    .card-title{
      font-size:17px;
      color:#555;
      margin-bottom:10px;
    }
    .input-line{
      display:flex;
      align-items:center;
      margin-bottom:14px;
    }
    .input-line label{
      width:110px;
      font-size:17px;
      color:#444;
    }
    .input-line input{
      flex:1;
      border:none;
      border-bottom:1px solid #ddd;
      font-size:17px;
      padding:6px 4px;
      outline:none;
    }
    /* 部位按钮组 */
    .part-btn-wrap{
      display:flex;
      gap:12px;
      margin:12px 0 20px;
    }
    .part-btn{
      padding:12px 22px;
      border-radius:999px;
      border:none;
      font-size:17px;
      background:#e8e9ed;
      cursor:pointer;
    }
    .part-btn.active{
      background:#007aff;
      color:#fff;
    }
    .action-card-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
    }
    .select-all{
      color:#007aff;
      font-size:16px;
      cursor:pointer;
    }
    .action-item{
      display:flex;
      align-items:center;
      margin:16px 0;
      font-size:18px;
      gap:10px;
    }
    .action-item input[type=checkbox]{
      width:24px;height:24px;
    }
    /* 表格取消横向滚动，自适应铺满 */
    .table-wrap {
      width:100%;
    }
    table {
      width:100%;
      border-collapse:collapse;
      table-layout: fixed;
    }
    /* 设置每列固定宽度 */
    table th:nth-child(1){width:16%;}
    table th:nth-child(2){width:28%;}
    table th:nth-child(3){width:18%;}
    table th:nth-child(4){width:18%;}
    table th:nth-child(5){width:20%;}
    th,td {
      border:none;
      text-align:center;
      padding:12px 4px;
      font-size:17px;
    }
    th{
      color:#777;
      font-weight:normal;
    }
    td input{
      width:90%;
      border:none;
      text-align:center;
      font-size:17px;
      outline:none;
    }
    /* 汇总框底色改为白色 */
    .summary-box{
      width:100%;
      min-height:80px;
      border:none;
      background:#ffffff;
      border-radius:12px;
      padding:14px;
      font-size:17px;
      white-space:pre-wrap;
    }
    /* 底部按钮 */
    .bottom-btn-wrap{
      display:flex;
      gap:14px;
      margin-top:20px;
    }
    .bottom-btn{
      flex:1;
      padding:16px;
      border-radius:14px;
      border:none;
      font-size:19px;
      cursor:pointer;
    }
    .bottom-btn.blue{
      background:#007aff;
      color:#fff;
    }
    .bottom-btn.grey{
      background:#e8e9ed;
      color:#777;
    }
    .hidden{display:none;}
  </style>
</head>
<body>
<div class="header-bar">健身训练记录</div>
<div class="tab-top-wrap">
  <div class="tab-top active" data-tab="record">记录</div>
  <div class="tab-top" data-tab="template">模板管理</div>
  <div class="tab-top" data-tab="history">历史记录</div>
</div>
<div class="container">
  <!-- ========== 记录页面 ========== -->
  <div id="record" class="tab-content">
    <div class="card">
      <div class="input-line">
        <label>学员姓名</label>
        <input id="stuName" placeholder="输入学员姓名" />
      </div>
      <div class="input-line">
        <label>上课时间</label>
        <input id="classDate" type="date" />
      </div>
      <div class="input-line">
        <label>剩余课程</label>
        <input id="remainCourse" placeholder="输入剩余节数" type="number" />
      </div>
    </div>

    <div>
      <div class="card-title">选择训练部位</div>
      <div class="part-btn-wrap" id="partBtnWrap">
        <!-- 部位按钮JS生成 -->
      </div>
    </div>

    <div class="card">
      <div class="action-card-header">
        <div style="font-size:18px;font-weight:600" id="actionPartTitle">肩</div>
        <div class="select-all" id="selectAllBtn">全选/取消</div>
      </div>
      <div id="actionList"></div>
    </div>

    <div>
      <div class="card-title">训练记录</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>部位</th><th>动作</th><th>重量(kg)</th><th>次数</th><th>组数</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div>
      <div class="card-title">训练内容汇总</div>
      <div class="summary-box" id="summaryText">(训练内容汇总：)</div>
    </div>

    <div class="bottom-btn-wrap">
      <button class="bottom-btn blue" id="copyBtn">复制汇总文本</button>
      <button class="bottom-btn grey" id="saveRecordBtn">保存记录</button>
    </div>
  </div>

  <!-- ========== 模板管理 ========== -->
  <div id="template" class="tab-content hidden">
    <div class="card">
      <div class="title">新增训练部位 & 动作</div>
      <div class="input-line">
        <input id="newPart" placeholder="训练部位，例：肩" />
        <input id="newAction" placeholder="训练动作，例：坐姿推肩" />
        <button id="addTemplateBtn">添加模板</button>
      </div>
    </div>
    <div class="card">
      <div class="title">已保存模板列表</div>
      <div id="templateList"></div>
      <div class="bottom-btn-wrap">
        <button id="exportAll">导出全部备份</button>
        <button id="importBtn">导入备份</button>
        <input type="file" id="fileInput" accept=".json" class="hidden">
      </div>
    </div>
  </div>

  <!-- ========== 历史记录 ========== -->
  <div id="history" class="tab-content hidden">
    <div class="card">
      <div class="title">历史训练记录</div>
      <div id="historyList"></div>
    </div>
  </div>
</div>

<script>
// 本地存储KEY
const STORAGE_KEY_TPL = "train_template";
const STORAGE_KEY_HIST = "train_history";

// 默认模板（肩、胸、背、臀腿）
let templateList = JSON.parse(localStorage.getItem(STORAGE_KEY_TPL)) || [
  {part:"肩",action:"坐姿推肩"},
  {part:"肩",action:"反向飞鸟"},
  {part:"肩",action:"哑铃侧平举"},
  {part:"胸",action:"平板推胸"},
  {part:"胸",action:"绳索飞鸟"},
  {part:"背",action:"高位下拉"},
  {part:"背",action:"坐姿划船"},
  {part:"臀腿",action:"臀推"},
  {part:"臀腿",action:"深蹲"},
];
let historyList = JSON.parse(localStorage.getItem(STORAGE_KEY_HIST)) || [];
let tableRows = [];
let currentSelectPart = "肩";

// 初始化日期
const today = new Date();
const dateStr = today.toISOString().split('T')[0];
document.getElementById("classDate").value = dateStr;

// 监听输入，实时更新汇总
document.getElementById("stuName").addEventListener('input', updateSummary);
document.getElementById("remainCourse").addEventListener('input', updateSummary);
document.getElementById("classDate").addEventListener('input', updateSummary);

// 顶部标签切换
document.querySelectorAll(".tab-top").forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll(".tab-top").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const target = tab.dataset.tab;
    document.querySelectorAll(".tab-content").forEach(c=>c.classList.add("hidden"));
    document.getElementById(target).classList.remove("hidden");
    if(target === "template") renderTemplateList();
    if(target === "history") renderHistory();
  }
})

// 渲染部位按钮（肩/胸/背/臀腿）
function renderPartButtons(){
  const wrap = document.getElementById("partBtnWrap");
  const parts = [...new Set(templateList.map(x=>x.part))];
  wrap.innerHTML = "";
  parts.forEach(p=>{
    const btn = document.createElement("button");
    btn.className = "part-btn" + (p===currentSelectPart ? " active":"");
    btn.innerText = p;
    btn.onclick = ()=>{
      currentSelectPart = p;
      renderPartButtons();
      renderActionList();
    }
    wrap.appendChild(btn);
  })
}

// 渲染当前部位动作列表
function renderActionList(){
  document.getElementById("actionPartTitle").innerText = currentSelectPart;
  const container = document.getElementById("actionList");
  container.innerHTML = "";
  const acts = templateList.filter(i=>i.part === currentSelectPart);
  acts.forEach(item=>{
    const div = document.createElement("div");
    div.className = "action-item";
    const existRow = tableRows.find(r=>r.part===item.part && r.action===item.action);
    const checked = existRow ? "checked" : "";
    div.innerHTML = `<input type="checkbox" class="action-check" data-part="${item.part}" data-action="${item.action}" ${checked}> ${item.action}`;
    container.appendChild(div);
  })
  // 勾选事件
  document.querySelectorAll(".action-check").forEach(cb=>{
    cb.onchange = function(){
      const p = this.dataset.part;
      const a = this.dataset.action;
      if(this.checked){
        const exist = tableRows.find(r=>r.part===p && r.action===a);
        if(!exist){
          tableRows.push({part:p,action:a,weight:"0",count:"0",group:"0"});
        }
      }else{
        tableRows = tableRows.filter(r=>!(r.part===p && r.action===a));
      }
      renderTable();
      updateSummary();
    }
  })
}

// 全选取消按钮
document.getElementById("selectAllBtn").onclick = function(){
  const acts = templateList.filter(i=>i.part === currentSelectPart);
  const allChecked = acts.every(item=>tableRows.find(r=>r.part===item.part && r.action===item.action));
  if(allChecked){
    //全部取消
    acts.forEach(item=>{
      tableRows = tableRows.filter(r=>!(r.part===item.part && r.action===item.action));
    })
  }else{
    //全部选中
    acts.forEach(item=>{
      const exist = tableRows.find(r=>r.part===item.part && r.action===item.action);
      if(!exist){
        tableRows.push({part:item.part,action:item.action,weight:"0",count:"0",group:"0"});
      }
    })
  }
  renderActionList();
  renderTable();
  updateSummary();
}

// 渲染训练表格
function renderTable(){
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";
  tableRows.forEach((row,idx)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row.part}</td>
      <td>${row.action}</td>
      <td><input value="${row.weight}" data-idx="${idx}" class="inp-weight"></td>
      <td><input value="${row.count}" data-idx="${idx}" class="inp-count"></td>
      <td><input value="${row.group}" data-idx="${idx}" class="inp-group"></td>
    `
    tbody.appendChild(tr);
  })
  document.querySelectorAll(".inp-weight,.inp-count,.inp-group").forEach(input=>{
    input.oninput = function(){
      const i = this.dataset.idx;
      if(this.classList.contains("inp-weight")) tableRows[i].weight=this.value;
      if(this.classList.contains("inp-count")) tableRows[i].count=this.value;
      if(this.classList.contains("inp-group")) tableRows[i].group=this.value;
      updateSummary();
    }
  })
}

// 更新汇总文本
function updateSummary(){
  const name = document.getElementById("stuName").value || "";
  const date = document.getElementById("classDate").value;
  const remain = document.getElementById("remainCourse").value || "";
  let text = "";
  if(name) text += `学员：${name}\n`;
  if(date) text += `上课时间：${date}\n`;
  if(remain) text += `剩余课程：${remain}节\n`;
  const groupByPart = {};
  tableRows.forEach(r=>{
    if(!groupByPart[r.part]) groupByPart[r.part]=[];
    groupByPart[r.part].push(r);
  })
  for(let p in groupByPart){
    text += `${p}：`
    const acts = groupByPart[p].map(a=>{
      let str = a.action;
      if(a.weight) str += ` ${a.weight}kg`;
      if(a.count) str += ` ×${a.count}`;
      if(a.group) str += ` ×${a.group}组`;
      return str;
    })
    text += acts.join("、") + "\n";
  }
  if(!text) text = "(训练内容汇总：)";
  document.getElementById("summaryText").innerText = text;
}

// 复制汇总
document.getElementById("copyBtn").onclick = async ()=>{
  const txt = document.getElementById("summaryText").innerText;
  try{
    await navigator.clipboard.writeText(txt);
    alert("✅ 复制成功！");
  }catch(e){
    alert("复制失败，请手动选中文字复制");
  }
}

// 保存记录
document.getElementById("saveRecordBtn").onclick = ()=>{
  const rec = {
    name:document.getElementById("stuName").value,
    date:document.getElementById("classDate").value,
    remain:document.getElementById("remainCourse").value,
    rows:JSON.parse(JSON.stringify(tableRows)),
    summary:document.getElementById("summaryText").innerText
  }
  if(!rec.name){alert("请填写学员姓名");return;}
  historyList.unshift(rec);
  localStorage.setItem(STORAGE_KEY_HIST, JSON.stringify(historyList));
  alert("✅ 记录保存成功！");
}

//模板相关
document.getElementById("addTemplateBtn").onclick = ()=>{
  const p = document.getElementById("newPart").value.trim();
  const a = document.getElementById("newAction").value.trim();
  if(!p||!a){alert("请填写部位和动作");return;}
  templateList.push({part:p,action:a});
  localStorage.setItem(STORAGE_KEY_TPL, JSON.stringify(templateList));
  renderPartButtons();
  renderTemplateList();
  document.getElementById("newPart").value="";
  document.getElementById("newAction").value="";
}
function renderTemplateList(){
  const wrap = document.getElementById("templateList");
  wrap.innerHTML="";
  templateList.forEach((item,idx)=>{
    const div = document.createElement("div");
    div.style="padding:8px 0;display:flex;justify-content:space-between;";
    div.innerHTML = `<span>${item.part} - ${item.action}</span> <button data-idx="${idx}">删除</button>`
    wrap.appendChild(div);
  })
  document.querySelectorAll("#templateList button").forEach(btn=>{
    btn.onclick = function(){
      const i = this.dataset.idx;
      templateList.splice(i,1);
      localStorage.setItem(STORAGE_KEY_TPL, JSON.stringify(templateList));
      renderPartButtons();
      renderTemplateList();
    }
  })
}
//历史记录
function renderHistory(){
  const wrap = document.getElementById("historyList");
  if(historyList.length===0){wrap.innerText="暂无历史记录";return;}
  wrap.innerHTML="";
  historyList.forEach((h,idx)=>{
    const div = document.createElement("div");
    div.style="padding:12px 0;border-bottom:1px solid #eee;";
    div.innerHTML = `
      <div style="font-weight:500">${h.name}｜${h.date}</div>
      <div style="margin:6px 0;white-space:pre-wrap;font-size:14px;color:#444">${h.summary}</div>
      <button class="copy-his" data-idx="${idx}">复制</button>
    `
    wrap.appendChild(div);
  })
  document.querySelectorAll(".copy-his").forEach(btn=>{
    btn.onclick = async function(){
      const i = this.dataset.idx;
      const txt = historyList[i].summary;
      await navigator.clipboard.writeText(txt);
      alert("✅ 已复制");
    }
  })
}
//导出导入
document.getElementById("exportAll").onclick = ()=>{
  const backup = {template:templateList, history:historyList};
  const blob = new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "训练记录备份.json";
  a.click();
  URL.revokeObjectURL(url);
}
document.getElementById("importBtn").onclick = ()=>{document.getElementById("fileInput").click();}
document.getElementById("fileInput").onchange = function(e){
  const f = e.target.files[0];
  const reader = new FileReader();
  reader.onload = ev=>{
    const data = JSON.parse(ev.target.result);
    templateList = data.template;
    historyList = data.history;
    localStorage.setItem(STORAGE_KEY_TPL, JSON.stringify(templateList));
    localStorage.setItem(STORAGE_KEY_HIST, JSON.stringify(historyList));
    renderPartButtons();
    renderTemplateList();
    alert("✅ 备份导入成功");
  }
  reader.readAsText(f);
}

//页面初始化
renderPartButtons();
renderActionList();
renderTable();
updateSummary();
renderTemplateList();
</script>
</body>
</html>
